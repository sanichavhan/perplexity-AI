<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0e0e0e;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        .glass-panel {
            background: rgba(19, 19, 19, 0.7);
            backdrop-filter: blur(20px);
        }

    body {
      min-height: max(884px, 100dvh);

<body class="bg-background text-on-background min-h-screen flex flex-col selection:bg-tertiary/30">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-6 py-4 bg-[#0e0e0e]/80 dark:bg-zinc-950/80 backdrop-blur-xl">
<div class="flex items-center gap-4">
<button class="text-zinc-300 dark:text-zinc-400 hover:text-zinc-100 transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</button>
</div>
<div class="text-xl font-black tracking-[-0.04em] text-zinc-100 dark:text-zinc-200">CURATOR</div>
<div class="flex items-center gap-4">
<button class="text-zinc-300 dark:text-zinc-400 hover:text-zinc-100 transition-colors">
<span class="material-symbols-outlined">account_circle</span>
</button>
</div>
</header>
<main class="flex-grow flex items-center justify-center px-6 pt-24 pb-12">
<div class="w-full max-w-md">
<!-- Hero Aesthetic Element -->
<div class="mb-12 text-center">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-xl bg-surface-container mb-6 outline outline-1 outline-outline-variant/20">
<span class="material-symbols-outlined text-tertiary text-3xl" style="font-variation-settings: 'FILL' 1;">shutter_speed</span>
</div>
<h1 class="text-4xl font-black tracking-tighter text-on-surface mb-2 uppercase">Begin Your Archive</h1>
<p class="text-on-surface-variant font-light tracking-tight">Create a unique digital identifier to start curating.</p>
</div>
<!-- Registration Form -->
<form class="space-y-6">
<!-- Username Field -->
<div class="space-y-2">
<label class="block text-[10px] uppercase tracking-[0.2em] font-bold text-secondary mb-1 ml-1" for="username">Username</label>
<div class="relative group">
<div class="absolute inset-y-0 left-4 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-sm">alternate_email</span>
</div>
<input class="w-full pl-11 pr-4 py-4 bg-surface-container-low border-none rounded-xl text-on-surface placeholder:text-outline focus:ring-1 focus:ring-tertiary/50 transition-all duration-300" id="username" placeholder="curator_prime" type="text"/>
</div>
</div>
<!-- Email Field -->
<div class="space-y-2">
<label class="block text-[10px] uppercase tracking-[0.2em] font-bold text-secondary mb-1 ml-1" for="email">Email Address</label>
<div class="relative group">
<div class="absolute inset-y-0 left-4 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-sm">mail</span>
</div>
<input class="w-full pl-11 pr-4 py-4 bg-surface-container-low border-none rounded-xl text-on-surface placeholder:text-outline focus:ring-1 focus:ring-tertiary/50 transition-all duration-300" id="email" placeholder="identity@monolith.ai" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<label class="block text-[10px] uppercase tracking-[0.2em] font-bold text-secondary mb-1 ml-1" for="password">Password</label>
<div class="relative group">
<div class="absolute inset-y-0 left-4 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-sm">lock</span>
</div>
<input class="w-full pl-11 pr-4 py-4 bg-surface-container-low border-none rounded-xl text-on-surface placeholder:text-outline focus:ring-1 focus:ring-tertiary/50 transition-all duration-300" id="password" placeholder="••••••••••••" type="password"/>
<button class="absolute inset-y-0 right-4 flex items-center text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-sm">visibility</span>
</button>
</div>
</div>
<!-- Register Button -->
<div class="pt-4">
<button class="w-full py-5 bg-primary text-on-primary font-black uppercase tracking-[0.1em] rounded-xl hover:bg-white active:scale-[0.98] transition-all duration-200 shadow-xl shadow-black/40" type="submit">
                        Register
                    </button>
</div>
</form>
<!-- Social/Alt Login Section -->
<div class="mt-12 space-y-6">
<div class="flex items-center gap-4">
<div class="h-[1px] flex-grow bg-outline-variant/20"></div>
<span class="text-[10px] uppercase tracking-widest text-outline">Secure Protocol</span>
<div class="h-[1px] flex-grow bg-outline-variant/20"></div>
</div>
<!-- Secondary Auth Actions -->
<div class="grid grid-cols-1 gap-4">
<div class="flex justify-center">
<a class="text-sm font-medium tracking-tight text-on-surface-variant hover:text-tertiary transition-colors flex items-center gap-2" href="#">
                            Already have an account? <span class="text-on-surface font-bold">Log in</span>
</a>
</div>
</div>
</div>
</div>
</main>
<!-- BottomNavBar (Suppressed for focused Transactional task as per mandate, but structure kept for brand context if needed - Here showing as suppressed by UX policy) -->
<!-- The mandate: "Automated Suppression: You MUST exclude the navigation shell if the page intent is: Sign-up" -->
<!-- Placeholder for visual depth at the bottom -->
<div class="fixed bottom-0 left-0 w-full h-32 bg-gradient-to-t from-background to-transparent pointer-events-none"></div>
<!-- Background Accents -->
<div class="fixed top-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-tertiary/5 blur-[120px] pointer-events-none"></div>
<div class="fixed bottom-[-5%] left-[-5%] w-[30%] h-[30%] rounded-full bg-primary/5 blur-[100px] pointer-events-none"></div>
